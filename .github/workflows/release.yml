name: Release

# Al subir un tag (v1.0.0, etc.) se compila y se publica el release.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt (DLLs + plugins junto al .exe)
        run: windeployqt --release --no-translations --compiler-runtime build\Release\hoverlyrics.exe

      - name: Empaquetar portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Release\* dist -Recurse
          Copy-Item gifs dist -Recurse
          Copy-Item README.md dist
          Compress-Archive -Path dist\* -DestinationPath HoverLyrics-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: HoverLyrics-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          arch: linux_gcc_64
          cache: true

      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxkbcommon-dev \
            libxcb1-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: AppImage (linuxdeploy)
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=$(command -v qmake6 || command -v qmake)
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p AppDir/usr/bin
          cp build/hoverlyrics AppDir/usr/bin/
          cp -r gifs AppDir/usr/bin/gifs
          ./linuxdeploy --appdir AppDir \
            --desktop-file packaging/hoverlyrics.desktop \
            --icon-file packaging/hoverlyrics.svg \
            --plugin qt \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.AppImage"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.AppImage
          generate_release_notes: true
